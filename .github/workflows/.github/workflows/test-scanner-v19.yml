
name: PokéWatch V1.9 Checkpoint Test

on:
  push:
    branches:
      - feature/pokewatch-v1-9-checkpoint
    paths:
      - .github/workflows/test-scanner-v19.yml

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pokewatch-v19-checkpoint
  cancel-in-progress: false

jobs:
  checkpoint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout V1.9 test branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Check Python syntax
        run: python -m py_compile test_scanner.py

      - name: Run PokéWatch V1.9
        env:
          TCG_API_KEY: ${{ secrets.TCG_API_KEY }}
        run: python test_scanner.py

      - name: Upload V1.9 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pokewatch-v19-results
          path: |
            scanner_state.json
            scanner_candidates.json
            scanner_price_history.json
          if-no-files-found: warn
          retention-days: 30

      - name: Save V1.9 checkpoints
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add scanner_state.json
          git add scanner_candidates.json
          git add scanner_price_history.json

          if ! git diff --cached --quiet; then
            git commit -m "Save PokéWatch V1.9 checkpoints"
            git push
          else
            echo "No changes to save"
          fi
