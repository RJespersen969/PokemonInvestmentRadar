
name: PokeWatch Investment Radar

on:
  workflow_dispatch:

jobs:
  radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Investment Radar
        env:
          TCG_API_KEY: ${{ secrets.TCG_API_KEY }}
        run: python investment_radar.py
  

      - name: Upload price report
        uses: actions/upload-artifact@v4
        with:
          name: investment-radar-report
          path: reports/latest.json
          retention-days: 30
