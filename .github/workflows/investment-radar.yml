
name: PokeWatch Investment Radar


on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
      timezone: 'Europe/Copenhagen'
  
  

permissions:
  contents: write

concurrency:
  group: investment-radar-history
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run Investment Radar
        env:
          TCG_API_KEY: ${{ secrets.TCG_API_KEY }}
        run: python investment_radar.py

      - name: Upload price report
        uses: actions/upload-artifact@v4
        with:
          name: investment-radar-report
          path: reports/latest.json
          retention-days: 30

      - name: Save price history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add price_history.json
          if git diff --cached --quiet; then
            echo "Ingen nye prisændringer."
          else
            git commit -m "Update Pokemon price history"
            git push
          fi
  
