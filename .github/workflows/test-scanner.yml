
name: Test Opportunity Scanner

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-scanner:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Test TCG API Scanner
        env:
          TCG_API_KEY: ${{ secrets.TCG_API_KEY }}
        run: python test_scanner.py
        
      - name: Upload scanner candidates
        uses: actions/upload-artifact@v4
        with:
          name: pokewatch-scanner-candidates
          path: scanner_candidates.json
          if-no-files-found: error
          retention-days: 30

