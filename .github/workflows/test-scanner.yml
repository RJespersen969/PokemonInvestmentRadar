
name: PokeWatch Daily Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "30 7 * * *"

permissions:
  contents: write

concurrency:
  group: pokewatch-opportunity-scanner
  cancel-in-progress: false

jobs:
  test-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run PokeWatch Scanner V1.9.1
        env:
          TCG_API_KEY: ${{ secrets.TCG_API_KEY }}
        run: python test_scanner.py

      - name: Send Discord Investment Picks
        env:
          DISCORD_INVESTMENT_WEBHOOK: ${{ secrets.DISCORD_INVESTMENT_WEBHOOK }}
        run: python discord_investment_picks.py

      - name: Send Discord Market Analysis
        env:
          DISCORD_MARKET_ANALYSIS_WEBHOOK: ${{ secrets.DISCORD_MARKET_ANALYSIS_WEBHOOK }}
        run: python discord_market_analysis.py

      - name: Upload scanner results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pokewatch-scanner-results
          path: |
            scanner_candidates.json
            scanner_state.json
            scanner_price_history.json
            discord_alert_state.json
          if-no-files-found: error
          retention-days: 30

      - name: Save scanner progress and price history
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add scanner_state.json
          git add scanner_candidates.json
          git add scanner_price_history.json

          if [ -f discord_alert_state.json ]; then
            git add discord_alert_state.json
          fi

          if ! git diff --cached --quiet; then
            git commit -m "Update PokeWatch scanner and Discord alerts"
            git push
          else
            echo "No changes to commit"
          fi
